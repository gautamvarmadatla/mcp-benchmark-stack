# MCP Benchmark Scenarios — 10 violating + 2 benign (12 total)
# Components: tools, auth_infra, server
# Lifecycle phases: creation_registration, discovery, invocation_execution, update_maintenance

scenarios:

  # --- VIOLATING ---

  - id: S1
    description: "Over-broad file scope: read_file with absolute path /"
    transport: stdio
    violating: true
    component: tools
    lifecycle_phase: creation_registration
    evidence_kind: policy_violation
    command: python
    args: ["servers/file_stdio_server/server.py"]
    env: {}
    tool: read_file
    tool_args:
      path: "/etc/passwd"

  - id: S2
    description: "Egress-policy denial: outbound fetch to blocklisted host (evil.example.org)"
    transport: http
    violating: true
    component: tools
    lifecycle_phase: invocation_execution
    evidence_kind: policy_violation
    url: "http://127.0.0.1:8001/mcp"
    headers: {}
    tool: fetch_url
    tool_args:
      url: "https://evil.example.org/data"

  - id: S3
    description: "Poisoned tool metadata: description contains script injection"
    transport: stdio
    violating: true
    component: tools
    lifecycle_phase: discovery
    evidence_kind: metadata_violation
    command: python
    args: ["servers/file_stdio_server/server.py"]
    env: {}
    tool: read_file
    tool_args:
      path: "hello.txt"
    metadata_check:
      inject_description: "<script>alert(1)</script> Read a file"
      expect_violation: true

  - id: S4
    description: "Admission check: tool hash not in approved set — unapproved tool rejected at registration"
    transport: stdio
    violating: true
    component: tools
    lifecycle_phase: creation_registration
    evidence_kind: hash_mismatch
    command: python
    args: ["servers/file_stdio_server/server.py"]
    env: {}
    tool: read_file
    tool_args:
      path: "hello.txt"
    integrity_check:
      mode: admission
      expected_hash: "WRONG_HASH_AAAA1111"
      resource_uri: "tool-integrity://hash"

  - id: S5
    description: "Out-of-scope token: token has wrong scope for get_secret"
    transport: http
    violating: true
    component: auth_infra
    lifecycle_phase: invocation_execution
    evidence_kind: authz_denied
    url: "http://127.0.0.1:8002/mcp"
    headers:
      Authorization: "Bearer scope-limited-token-xyz"
    tool: get_secret
    tool_args:
      key: "db_password"

  - id: S6
    description: "Unauthorized principal: blacklisted user attempts get_secret"
    transport: http
    violating: true
    component: auth_infra
    lifecycle_phase: invocation_execution
    evidence_kind: authz_denied
    url: "http://127.0.0.1:8002/mcp"
    headers:
      Authorization: "Bearer unauthorized-token-000"
    tool: get_secret
    tool_args:
      key: "api_key"

  - id: S7
    description: "Post-approval drift: the live tool-definition hash no longer matches the registered approval baseline"
    transport: stdio
    violating: true
    component: tools
    lifecycle_phase: update_maintenance
    evidence_kind: hash_mismatch
    command: python
    args: ["servers/file_stdio_server/server.py"]
    env:
      REGISTERED_TOOL_HASH: "APPROVED_HASH_CCCC3333"
    tool: read_file
    tool_args:
      path: "hello.txt"
    integrity_check:
      mode: baseline
      resource_uri: "tool-integrity://hash"

  - id: S8
    description: "Observability gap: real egress denial occurs but server is configured not to emit the denial trace artifact"
    transport: http
    violating: true
    component: server
    lifecycle_phase: update_maintenance
    evidence_kind: observability_gap
    url: "http://127.0.0.1:8003/mcp"
    headers: {}
    tool: fetch_url
    tool_args:
      url: "https://malicious.attacker.io/exfil"
    observability_check: true
    server_trace_dir: "evidence/server_traces_s8"

  # --- DIVERGENCE SCENARIOS (expose gap between modes) ---

  - id: S11
    description: "Runtime integrity drift: the tool definition is mutated mid-session; re-verifying the live hash against the session-start snapshot detects the change"
    transport: stdio
    violating: true
    component: tools
    lifecycle_phase: update_maintenance
    evidence_kind: hash_mismatch
    command: python
    args: ["servers/file_stdio_server/server.py"]
    env:
      RUNTIME_MUTATE: "1"
    tool: read_file
    tool_args:
      path: "hello.txt"
    integrity_check:
      mode: runtime
      resource_uri: "tool-integrity://hash"

  - id: S12
    description: "Overbroad-scoped tool: read_metric requires read:secrets though it only needs read:metrics, so a token holding read:metrics is denied; the root cause is the tool's scope configuration"
    transport: http
    violating: true
    component: tools
    lifecycle_phase: creation_registration
    evidence_kind: authz_denied
    url: "http://127.0.0.1:8002/mcp"
    headers:
      Authorization: "Bearer scope-limited-token-xyz"
    tool: read_metric
    tool_args:
      name: "request_latency"

  # --- BENIGN ---

  - id: S9
    description: "Approved tool with valid scope, identity, and metadata"
    transport: stdio
    violating: false
    component: tools
    lifecycle_phase: creation_registration
    evidence_kind: clean_execution
    command: python
    args: ["servers/file_stdio_server/server.py"]
    env: {}
    tool: read_file
    tool_args:
      path: "hello.txt"

  - id: S10
    description: "Authorized HTTP call with valid token, complete logs and traces"
    transport: http
    violating: false
    component: auth_infra
    lifecycle_phase: invocation_execution
    evidence_kind: clean_execution
    url: "http://127.0.0.1:8002/mcp"
    headers:
      Authorization: "Bearer valid-token-abc123"
    tool: get_secret
    tool_args:
      key: "db_password"
